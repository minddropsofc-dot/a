<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LATAM Airlines - Login</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #ffffff url('bg.png') no-repeat center bottom;
    background-size: cover;
  }

  .card {
    background: #ffffff;
    width: 100%;
    max-width: 480px; /* aumentado */
    border-radius: 16px;
    box-shadow: 0 12px 40px rgba(0, 0, 0, 0.08);
    overflow: hidden;
    border-top: 4px solid #2b1e6b;
    margin: 20px;
  }

  .card-inner {
    padding: 48px 44px 40px; /* padding maior também */
  }

  .logo {
    display: flex;
    align-items: center;
    margin-bottom: 36px;
  }

  .logo img {
    height: 38px;
    width: auto;
  }

  h1 {
    font-size: 26px;
    font-weight: 600;
    color: #1e1b4b;
    margin-bottom: 10px;
    line-height: 1.25;
  }

  .subtitle {
    font-size: 14px;
    color: #5b5675;
    margin-bottom: 32px;
    line-height: 1.45;
  }

  .field {
    margin-bottom: 28px;
  }

  input[type="text"],
  input[type="email"] {
    width: 100%;
    padding: 15px 16px;
    border: 1px solid #d1d5db;
    border-radius: 8px;
    font-size: 15px;
    color: #1f2937;
    background: #fff;
    transition: border-color 0.2s, box-shadow 0.2s;
  }

  input::placeholder {
    color: #9ca3af;
  }

  input:focus {
    outline: none;
    border-color: #e11d48;
    box-shadow: 0 0 0 3px rgba(225, 29, 72, 0.12);
  }

  .btn-continue {
    width: 100%;
    background: #e11d48;
    color: white;
    border: none;
    border-radius: 8px;
    padding: 16px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s;
    margin-bottom: 22px;
  }

  .btn-continue:hover {
    background: #be123c;
  }

  .create-account {
    text-align: center;
    margin-bottom: 30px;
  }

  .create-account a {
    color: #e11d48;
    font-size: 15px;
    font-weight: 600;
    text-decoration: none;
  }

  .create-account a:hover {
    text-decoration: underline;
  }

  .divider {
    height: 1px;
    background: #e5e7eb;
    margin-bottom: 22px;
  }

  .regain {
    text-align: center;
    font-size: 13.5px;
    color: #6b7280;
  }

  .regain a {
    color: #2563eb;
    text-decoration: none;
    font-weight: 500;
  }

  .regain a:hover {
    text-decoration: underline;
  }
</style>
</head>
<body>

  <div class="card">
    <div class="card-inner">
      
      <!-- Logo oficial -->
      <div class="logo">
        <img src="logo.png" alt="LATAM Airlines">
      </div>

      <h1>Please enter your user ID</h1>
      <p class="subtitle">If you are already a LATAM member, please enter your log in details:</p>

      <form id="loginForm">
        <div class="field">
          <input 
            type="text" 
            id="userId" 
            name="userId" 
            placeholder="Email or membership number" 
            autocomplete="username"
            required
          >
        </div>

        <button type="submit" class="btn-continue">Continue</button>
      </form>

      <div class="create-account">
        <a href="#">Create account</a>
      </div>

      <div class="divider"></div>

      <div class="regain">
        Can’t log in to your account? <a href="#">Regain access</a>
      </div>

    </div>
  </div>

<script>
  document.getElementById('loginForm').addEventListener('submit', function(e) {
    e.preventDefault();
    const userId = document.getElementById('userId').value.trim();
    console.log('User ID:', userId);
  });
</script>

</body>
</html>
